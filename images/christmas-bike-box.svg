<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t">
  <title id="t">A new bike in a Christmas gift box with a red ribbon, bow, holly and falling snow</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B3B"/>
      <stop offset="1" stop-color="#050511"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a3a"/>
      <stop offset="1" stop-color="#14592a"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f4a22"/>
      <stop offset="1" stop-color="#0b3a1a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8102e"/>
      <stop offset="0.5" stop-color="#ff2d4a"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#FF8000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.4" fill="#ffffff" opacity="0.18"/>
      <circle cx="21" cy="21" r="2.4" fill="#ffd24a" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="520" fill="url(#sky)"/>
  <ellipse cx="300" cy="300" rx="300" ry="230" fill="url(#glow)"/>

  <!-- String lights -->
  <path d="M0 40 Q150 95 300 45 T600 40" fill="none" stroke="#2a2a4a" stroke-width="2"/>
  <g>
    <circle cx="40" cy="55" r="6" fill="#ff3b3b"/><circle cx="95" cy="70" r="6" fill="#ffd24a"/>
    <circle cx="150" cy="74" r="6" fill="#36d26b"/><circle cx="205" cy="66" r="6" fill="#4aa8ff"/>
    <circle cx="260" cy="52" r="6" fill="#FF8000"/><circle cx="340" cy="44" r="6" fill="#ff3b3b"/>
    <circle cx="395" cy="56" r="6" fill="#ffd24a"/><circle cx="450" cy="66" r="6" fill="#36d26b"/>
    <circle cx="505" cy="64" r="6" fill="#4aa8ff"/><circle cx="560" cy="52" r="6" fill="#FF8000"/>
  </g>

  <!-- Snow ground -->
  <path d="M0 455 Q150 430 300 448 T600 440 V520 H0 Z" fill="#e8eef7"/>
  <path d="M0 470 Q160 452 320 468 T600 462 V520 H0 Z" fill="#ffffff"/>

  <!-- Bike rising out of the box (drawn first so the box front covers its lower half) -->
  <g stroke="#FF8000" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wheels -->
    <circle cx="205" cy="255" r="72" stroke="#1b1b1b" stroke-width="12"/>
    <circle cx="205" cy="255" r="62" stroke="#9aa3b2" stroke-width="3"/>
    <circle cx="405" cy="255" r="72" stroke="#1b1b1b" stroke-width="12"/>
    <circle cx="405" cy="255" r="62" stroke="#9aa3b2" stroke-width="3"/>
    <g stroke="#cfd6e0" stroke-width="1.5" opacity="0.8">
      <line x1="205" y1="193" x2="205" y2="317"/><line x1="143" y1="255" x2="267" y2="255"/>
      <line x1="161" y1="211" x2="249" y2="299"/><line x1="249" y1="211" x2="161" y2="299"/>
      <line x1="405" y1="193" x2="405" y2="317"/><line x1="343" y1="255" x2="467" y2="255"/>
      <line x1="361" y1="211" x2="449" y2="299"/><line x1="449" y1="211" x2="361" y2="299"/>
    </g>
    <!-- Frame -->
    <g stroke-width="11">
      <line x1="205" y1="255" x2="290" y2="262"/>
      <line x1="205" y1="255" x2="268" y2="165"/>
      <line x1="290" y1="262" x2="268" y2="165"/>
      <line x1="268" y1="165" x2="375" y2="168"/>
      <line x1="290" y1="262" x2="378" y2="180"/>
    </g>
    <line x1="372" y1="150" x2="405" y2="255" stroke-width="9"/>
    <!-- Seatpost & saddle -->
    <line x1="268" y1="165" x2="262" y2="128" stroke="#2b2b2b" stroke-width="7"/>
    <path d="M232 124 Q262 114 292 126 Q262 133 232 124 Z" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="4"/>
    <!-- Stem & drop bars -->
    <line x1="372" y1="150" x2="368" y2="135" stroke="#2b2b2b" stroke-width="7"/>
    <path d="M362 134 H398 Q414 136 412 156 Q410 172 396 172" stroke="#1b1b1b" stroke-width="7"/>
    <!-- Crank -->
    <circle cx="290" cy="262" r="16" fill="#cfd6e0" stroke="#7a8494" stroke-width="3"/>
  </g>

  <!-- Box top rim / open flaps -->
  <polygon points="110,270 150,250 470,250 500,270" fill="#0f4a22"/>
  <polygon points="110,270 60,215 150,232 150,250" fill="#1f7a3a"/>
  <polygon points="110,270 60,215 150,232 150,250" fill="url(#dots)"/>
  <polygon points="500,270 552,214 470,232 470,250" fill="#1f7a3a"/>
  <polygon points="500,270 552,214 470,232 470,250" fill="url(#dots)"/>

  <!-- Box side -->
  <polygon points="470,270 520,250 520,430 470,455" fill="url(#boxSide)"/>
  <polygon points="470,270 520,250 520,430 470,455" fill="url(#dots)"/>
  <!-- Box front -->
  <rect x="110" y="270" width="360" height="185" fill="url(#boxFront)"/>
  <rect x="110" y="270" width="360" height="185" fill="url(#dots)"/>
  <!-- Snow on box rim -->
  <path d="M110 272 Q140 262 170 272 T230 272 T290 272 T350 272 T410 272 T470 272 V280 H110 Z" fill="#ffffff"/>

  <!-- Ribbon -->
  <rect x="268" y="270" width="44" height="185" fill="url(#ribbon)"/>
  <rect x="110" y="345" width="360" height="34" fill="url(#ribbon)"/>
  <polygon points="470,345 520,328 520,360 470,379" fill="#a00d24"/>

  <!-- Bow -->
  <g transform="translate(290 360)">
    <path d="M0 0 C-30 -40 -85 -35 -78 -5 C-72 20 -25 15 0 0 Z" fill="#e0142f" stroke="#8f0a1e" stroke-width="3"/>
    <path d="M0 0 C30 -40 85 -35 78 -5 C72 20 25 15 0 0 Z" fill="#e0142f" stroke="#8f0a1e" stroke-width="3"/>
    <path d="M-6 6 L-34 62 L-18 56 L-10 70 L4 10 Z" fill="#c8102e"/>
    <path d="M6 6 L34 62 L18 56 L10 70 L-4 10 Z" fill="#c8102e"/>
    <circle r="14" fill="#ff2d4a" stroke="#8f0a1e" stroke-width="3"/>
  </g>

  <!-- Gift tag -->
  <g transform="translate(395 395) rotate(-8)">
    <line x1="-8" y1="-10" x2="-30" y2="-30" stroke="#f5e6c8" stroke-width="2"/>
    <rect x="-10" y="-14" width="72" height="34" rx="5" fill="#f5e6c8" stroke="#b8a27a" stroke-width="2"/>
    <circle cx="-2" cy="3" r="3" fill="#b8a27a"/>
    <text x="28" y="9" text-anchor="middle" font-family="Teko, Arial Narrow, sans-serif" font-size="18" font-weight="700" fill="#c8102e">$60</text>
  </g>

  <!-- Holly -->
  <g transform="translate(150 290)">
    <path d="M0 0 C10 -18 32 -16 40 -4 C30 -6 26 4 18 2 C14 10 4 8 0 0 Z" fill="#0f6b2c"/>
    <path d="M0 0 C-10 -18 -32 -16 -40 -4 C-30 -6 -26 4 -18 2 C-14 10 -4 8 0 0 Z" fill="#128a37"/>
    <circle cx="-5" cy="-4" r="6" fill="#d7192f"/><circle cx="6" cy="-6" r="6" fill="#d7192f"/><circle cx="1" cy="4" r="6" fill="#d7192f"/>
  </g>

  <!-- Snowflakes -->
  <g fill="#ffffff">
    <circle cx="60" cy="130" r="4" opacity="0.9"/><circle cx="120" cy="190" r="3" opacity="0.7"/>
    <circle cx="35" cy="300" r="3.5" opacity="0.8"/><circle cx="80" cy="380" r="2.5" opacity="0.6"/>
    <circle cx="170" cy="120" r="2.5" opacity="0.6"/><circle cx="300" cy="95" r="3" opacity="0.7"/>
    <circle cx="440" cy="110" r="4" opacity="0.9"/><circle cx="520" cy="160" r="3" opacity="0.7"/>
    <circle cx="565" cy="290" r="4" opacity="0.85"/><circle cx="545" cy="380" r="2.5" opacity="0.6"/>
    <circle cx="480" cy="200" r="2" opacity="0.5"/><circle cx="110" cy="250" r="2" opacity="0.5"/>
  </g>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <g transform="translate(500 125)"><line x1="-9" y1="0" x2="9" y2="0"/><line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8"/><line x1="-4.5" y1="7.8" x2="4.5" y2="-7.8"/></g>
    <g transform="translate(95 160)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="-4" y1="-7" x2="4" y2="7"/><line x1="-4" y1="7" x2="4" y2="-7"/></g>
    <g transform="translate(560 230)"><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-3.5" y1="-6" x2="3.5" y2="6"/><line x1="-3.5" y1="6" x2="3.5" y2="-6"/></g>
  </g>
</svg>
